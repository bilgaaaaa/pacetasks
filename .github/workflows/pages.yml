# Publishes the website: the pages in docs/ plus the web demo, built into demo/.
# Pull requests that touch the site only build it; main also deploys to GitHub Pages.
name: Website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docs/**
      - app.config.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp -r docs _site
      # Served at https://bilgaaaaa.github.io/pacetasks/demo/, so every bundled file needs that prefix.
      - run: npx expo export --platform web --output-dir _site/demo
        env:
          EXPO_PUBLIC_DEMO_MODE: "1"
          WEB_BASE_URL: /pacetasks/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
