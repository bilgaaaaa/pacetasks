# Runs on every change: types, unit tests, then the filmed simulated journey.
name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright cannot install Chromium yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Kept even when a step fails, so the film shows what went wrong.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-journey
          path: |
            e2e/output/*.webm
            e2e/output/shots/
          retention-days: 14
