# Builds the DeskFocus Mac app in mac/ whenever it changes.
name: Mac

on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac.yml']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Newest Xcode on the runner, so the macOS 26 Liquid Glass code path is compiled when available.
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version

      # Unsigned build: checks that the app and widget compile.
      - name: Build
        run: |
          xcodebuild build \
            -project Deskfocus.xcodeproj \
            -scheme Deskfocus \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log
          status=${PIPESTATUS[0]}
          # Compiler errors as annotations, so they show on the commit and pull request without opening the log.
          grep -E ": error: " build.log | sort -u | head -20 | sed 's/^/::error::/' || true
          exit $status

